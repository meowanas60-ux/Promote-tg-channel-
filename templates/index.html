  </div></footer><script>

let loadTimer = null;


async function loadApps() {

  clearTimeout(loadTimer);


  loadTimer = setTimeout(async () => {

    const box = document.getElementById("apps");


    try {

      const q =
        document.getElementById("q").value.trim();


      const response = await fetch(
        "/api/apps?q=" +
        encodeURIComponent(q),
        {
          headers: {
            "Accept": "application/json"
          }
        }
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      if (
        !data.apps ||
        !data.apps.length
      ) {

        box.innerHTML =
          '<div class="empty">No apps found yet.</div>';

        return;

      }


      box.innerHTML =
        data.apps.map(app => {

          const name =
            escapeHtml(
              app.name || "Unknown App"
            );


          const version =
            escapeHtml(
              app.version || "Latest"
            );


          const description =
            escapeHtml(
              app.description ||
              "No description available."
            );


          const downloadUrl =
            escapeAttr(
              app.download_url || "#"
            );


          return `

            <article class="card">

              <div class="icon">
                APK
              </div>


              <div class="info">

                <h2>
                  ${name}
                </h2>


                <div class="version">
                  ${version}
                </div>


                <p>
                  ${description}
                </p>


                <div class="card-actions">

                  <a
                    class="download"
                    href="${downloadUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Download
                  </a>


                  <a
                    class="direct"
                    href="https://omg10.com/4/11752243"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    More
                  </a>

                </div>

              </div>

            </article>

          `;

        }).join("");


    } catch (error) {

      console.error(
        "Apps loading error:",
        error
      );


      box.innerHTML = `
        <div class="empty">
          Could not load apps.
          Please refresh the page.
        </div>
      `;

    }

  }, 180);

}


function escapeHtml(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


function escapeAttr(value) {

  return escapeHtml(value);

}


/* Load apps when page opens */
loadApps();
